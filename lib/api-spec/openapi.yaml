openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SME Finance Copilot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Profiles
    description: User profile operations
  - name: Evidence
    description: Evidence upload and AI extraction
  - name: Transactions
    description: Financial transaction operations
  - name: Inbox
    description: Inbox item review and resolution
  - name: Position
    description: Computed financial position and business ideas
  - name: Tax
    description: Estimated income-tax operations
  - name: Decisions
    description: Decision memory and SA checklist
  - name: Copilot
    description: AI copilot operations
  - name: Demo
    description: Demo data operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      parameters:
        - name: X-Profile-Id
          in: header
          required: true
          description: The selected, authenticated business profile that will own the logical upload binding.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/uploads/direct:
    post:
      tags: [Storage]
      operationId: uploadPrivateObjectDirect
      summary: Upload private bytes through the API server
      description: >
        Uploads a private object without browser-to-storage CORS. X-Profile-Id
        binds the object to an authenticated business profile and
        enables safe same-user byte reuse without granting cross-profile access.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: X-Filename
          in: header
          required: false
          schema:
            type: string
        - name: X-Content-Type
          in: header
          required: false
          schema:
            type: string
        - name: X-Profile-Id
          in: header
          required: true
          description: An authenticated profile ID for a logical private-object binding.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Object stored or safely reused.
          content:
            application/json:
              schema:
                type: object
                required: [objectPath]
                properties:
                  objectPath:
                    type: string
        '400':
          description: Empty upload body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Requested profile was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      summary: List the authenticated user's profiles
      responses:
        '200':
          description: List of profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
    post:
      tags: [Profiles]
      operationId: createProfile
      summary: Create a new profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /profiles/{profileId}:
    patch:
      tags: [Profiles]
      operationId: updateProfile
      summary: Update editable profile context and optional opening-position coverage
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found or not owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles/{profileId}/position:
    get:
      tags: [Position]
      operationId: getFinancialPosition
      summary: Get the computed financial position for a profile
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Computed financial position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialPosition'

  /profiles/{profileId}/income-tax-estimate:
    get:
      tags: [Tax]
      operationId: getIncomeTaxEstimate
      summary: Get the live, current-tax-year estimated income-tax position
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Tax estimate based on canonical Financial Memory records and saved profile inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeTaxEstimateResponse'
        '404':
          description: Profile not found or not owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /self-assessment/identity:
    get:
      tags: [Tax]
      operationId: getSelfAssessmentIdentity
      summary: Read masked Self Assessment identity status
      responses:
        '200':
          description: Masked identity status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentIdentity'
    patch:
      tags: [Tax]
      operationId: updateSelfAssessmentIdentity
      summary: Save protected Self Assessment identity values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssessmentIdentityUpdate'
      responses:
        '200':
          description: Updated masked identity status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentIdentity'

  /self-assessment/sa100/{taxYear}:
    get:
      tags: [Tax]
      operationId: getSelfAssessmentSa100Context
      summary: Read user-owned Self Assessment return context
      parameters:
        - $ref: '#/components/parameters/TaxYearParam'
      responses:
        '200':
          description: User-owned SA100 context for a tax year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentSa100Context'
    patch:
      tags: [Tax]
      operationId: updateSelfAssessmentSa100Context
      summary: Update user-owned Self Assessment return context
      parameters:
        - $ref: '#/components/parameters/TaxYearParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssessmentSa100ContextUpdate'
      responses:
        '200':
          description: Updated user-owned SA100 context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentSa100Context'

  /profiles/{profileId}/self-assessment/sa103s:
    patch:
      tags: [Tax]
      operationId: updateSelfAssessmentSa103sContext
      summary: Update business-specific SA103S context
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssessmentSa103sContextUpdate'
      responses:
        '200':
          description: Updated business SA103S context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentSa103sContext'

  /profiles/{profileId}/self-assessment/readiness:
    get:
      tags: [Tax]
      operationId: getSelfAssessmentReadiness
      summary: Read combined Self Assessment return readiness for an active business profile
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Combined user SA100 and active business SA103S readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentReadinessResponse'

  /profiles/{profileId}/evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: List evidence items for a profile
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: List of evidence items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceItem'
    post:
      tags: [Evidence]
      operationId: createEvidence
      summary: Register a new evidence item after upload
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceInput'
      responses:
        '201':
          description: Evidence item created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceItem'

  /profiles/{profileId}/evidence/{evidenceId}/process:
    post:
      tags: [Evidence]
      operationId: processEvidence
      summary: Trigger AI extraction on an evidence item
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evidence processed — extractedData and confidence populated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceItem'
        '404':
          description: Evidence item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles/{profileId}/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for a profile
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: List of transactions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create a manual transaction
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  /profiles/{profileId}/transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get one Financial Memory transaction for a profile
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction or profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Edit a manually added transaction
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: Transaction updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Delete a manually added transaction
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Transaction deleted.

  /profiles/{profileId}/transactions/{transactionId}/evidence-links:
    get:
      tags: [Evidence]
      operationId: listTransactionEvidenceLinks
      summary: List active supporting-document links for a Financial Memory record
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active profile-scoped evidence links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceLink'
        '404':
          description: Transaction or profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles/{profileId}/financial-accounts:
    get:
      tags: [Bank imports]
      operationId: listFinancialAccounts
      summary: List financial accounts used as bank-import provenance
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Profile-owned financial accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialAccount'
    post:
      tags: [Bank imports]
      operationId: createFinancialAccount
      summary: Create a profile-owned financial account identity
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialAccountInput'
      responses:
        '201':
          description: Financial account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAccount'

  /profiles/{profileId}/bank-imports:
    get:
      tags: [Bank imports]
      operationId: listBankImports
      summary: List profile-scoped bank CSV import batches
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Bank import batches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankImportBatch'
    post:
      tags: [Bank imports]
      operationId: registerBankImport
      summary: Register a directly uploaded CSV and obtain a mapping proposal
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankImportRegistrationInput'
      responses:
        '201':
          description: New bank import registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportRegistration'
        '200':
          description: Existing same-file batch resumed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportRegistration'

  /profiles/{profileId}/bank-imports/{batchId}:
    get:
      tags: [Bank imports]
      operationId: getBankImport
      summary: Read one profile-scoped bank import and saved preview rows
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/BankImportBatchIdParam'
      responses:
        '200':
          description: Bank import details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportDetail'
    delete:
      tags: [Bank imports]
      operationId: discardBankImport
      summary: Discard an uncommitted bank import
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/BankImportBatchIdParam'
      responses:
        '200':
          description: Bank import discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportDiscardResult'

  /profiles/{profileId}/bank-imports/{batchId}/preview:
    post:
      tags: [Bank imports]
      operationId: previewBankImport
      summary: Validate a mapping and save a non-mutating bank import preview
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/BankImportBatchIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankImportPreviewInput'
      responses:
        '200':
          description: Validated preview rows and counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportDetail'

  /profiles/{profileId}/bank-imports/{batchId}/rows:
    patch:
      tags: [Bank imports]
      operationId: updateBankImportRows
      summary: Save explicit include or exclude choices for preview rows
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/BankImportBatchIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankImportRowSelectionInput'
      responses:
        '200':
          description: Updated preview selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportDetail'

  /profiles/{profileId}/bank-imports/{batchId}/commit:
    post:
      tags: [Bank imports]
      operationId: commitBankImport
      summary: Atomically commit selected rows to Financial Memory exactly once
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/BankImportBatchIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankImportCommitInput'
      responses:
        '200':
          description: Idempotent commit result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportCommitResult'

  /profiles/{profileId}/inbox:
    get:
      tags: [Inbox]
      operationId: listInboxItems
      summary: List inbox items for a profile
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: List of inbox items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboxItem'

  /profiles/{profileId}/inbox/{itemId}/resolve:
    patch:
      tags: [Inbox]
      operationId: resolveInboxItem
      summary: Resolve an inbox item — creates a transaction and updates financial position
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxResolveInput'
      responses:
        '200':
          description: Inbox item resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'

  /profiles/{profileId}/business-ideas:
    get:
      tags: [Position]
      operationId: listBusinessIdeas
      summary: List business ideas with live financial baselines
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: List of business ideas with live baselines.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessIdea'

  /profiles/{profileId}/decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      summary: List decision memory entries
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: List of decisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionMemory'
    post:
      tags: [Decisions]
      operationId: createDecision
      summary: Save a new decision
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '201':
          description: Decision saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionMemory'

  /profiles/{profileId}/decisions/{decisionId}:
    patch:
      tags: [Decisions]
      operationId: updateDecision
      summary: Update a decision (status, actual outcomes)
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionUpdate'
      responses:
        '200':
          description: Decision updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionMemory'

  /profiles/{profileId}/sa-checklist:
    get:
      tags: [Decisions]
      operationId: listSAChecklist
      summary: List SA readiness checklist items
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: List of SA checklist items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SAChecklistItem'

  /profiles/{profileId}/sa-checklist/{itemId}:
    patch:
      tags: [Decisions]
      operationId: updateSAChecklistItem
      summary: Mark a checklist item complete or incomplete
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SAChecklistUpdate'
      responses:
        '200':
          description: Checklist item updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAChecklistItem'

  /copilot/message:
    post:
      tags: [Copilot]
      operationId: sendCopilotMessage
      summary: Send a message to the AI copilot with live financial context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotMessageInput'
      responses:
        '200':
          description: AI response with financial context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotMessageResponse'

  /demo/reset:
    post:
      tags: [Demo]
      operationId: resetDemoData
      summary: Reset all user data and re-seed canonical demo data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoResetInput'
      responses:
        '200':
          description: Demo data reset and re-seeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResetResponse'

  /profiles/{profileId}/reconciliation:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationReview
      summary: List current reconciliation exceptions, staged workflow references, and coverage checks
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Profile-scoped reconciliation review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResponse'
    post:
      tags: [Reconciliation]
      operationId: scanReconciliationReview
      summary: Scan owned financial facts without changing financial records
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Refreshed reconciliation review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResponse'

  /profiles/{profileId}/reconciliation/scan:
    post:
      tags: [Reconciliation]
      operationId: scanReconciliationFacts
      summary: Re-run deterministic reconciliation detectors
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Refreshed reconciliation review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResponse'

  /profiles/{profileId}/reconciliation/exceptions/{exceptionId}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationException
      summary: Get an exception and its append-only resolution history
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: exceptionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Exception detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationExceptionDetail'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles/{profileId}/reconciliation/exceptions/{exceptionId}/resolve:
    post:
      tags: [Reconciliation]
      operationId: resolveReconciliationException
      summary: Apply one explicit, source-verified reconciliation action
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: exceptionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationResolutionInput'
      responses:
        '200':
          description: Resolved or replayed exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResolutionResponse'
        '409':
          description: The observed source revision changed or is being resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles/{profileId}/reconciliation/coverage-checks:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationCoverageChecks
      summary: List declared coverage checks
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      responses:
        '200':
          description: Coverage checks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconciliationCoverageCheck'
    post:
      tags: [Reconciliation]
      operationId: createReconciliationCoverageCheck
      summary: Declare complete expected coverage for an account and period
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationCoverageCheckInput'
      responses:
        '201':
          description: Coverage check created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationCoverageMutationResponse'

  /profiles/{profileId}/reconciliation/coverage-checks/{checkId}:
    patch:
      tags: [Reconciliation]
      operationId: updateReconciliationCoverageCheck
      summary: Amend a declared coverage check
      parameters:
        - $ref: '#/components/parameters/ProfileIdParam'
        - name: checkId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationCoverageCheckInput'
      responses:
        '200':
          description: Coverage check updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationCoverageMutationResponse'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: 'Opaque session token — `Bearer <sid>`.'
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    ProfileIdParam:
      name: profileId
      in: path
      required: true
      schema:
        type: string
    TaxYearParam:
      name: taxYear
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{4}/\d{2}$'
    BankImportBatchIdParam:
      name: batchId
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    Profile:
      type: object
      required: [id, userId, name, type, taxYear, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        type:
          type: string
        taxYear:
          type: string
        taxReserve:
          type: number
        industry:
          type: string
        vatRegistered:
          type: boolean
        accountingBasis:
          type: string
        openingPositionStatus:
          type: string
          enum: [not_started, skipped, complete]
        openingBalance:
          type: number
          nullable: true
        openingDetails:
          type: string
          nullable: true
        coverageStartDate:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        coverageEndDate:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        otherTaxableIncome:
          type: number
          nullable: true
        otherTaxableIncomeTaxYear:
          type: string
          nullable: true
        createdAt:
          type: string

    ProfileInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          default: sole_trader

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        industry:
          type: string
        vatRegistered:
          type: boolean
        taxYear:
          type: string
        accountingBasis:
          type: string
        taxReserve:
          type: number
        openingPositionStatus:
          type: string
          enum: [not_started, skipped, complete]
        openingBalance:
          type: number
          nullable: true
        openingDetails:
          type: string
          nullable: true
        coverageStartDate:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        coverageEndDate:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        otherTaxableIncome:
          type: number
          nullable: true
        otherTaxableIncomeTaxYear:
          type: string
          nullable: true

    SelfAssessmentIdentity:
      type: object
      required: [utrMasked, nationalInsuranceNumberMasked, hasUtr, hasNationalInsuranceNumber]
      properties:
        utrMasked:
          type: string
          nullable: true
          description: Masked only. The raw UTR is never returned.
        nationalInsuranceNumberMasked:
          type: string
          nullable: true
          description: Masked only. The raw National Insurance number is never returned.
        hasUtr:
          type: boolean
        hasNationalInsuranceNumber:
          type: boolean

    SelfAssessmentIdentityUpdate:
      type: object
      properties:
        utr:
          type: string
          nullable: true
          description: Write-only protected UTR. Never returned after save.
        nationalInsuranceNumber:
          type: string
          nullable: true
          description: Write-only protected National Insurance number. Never returned after save.

    SelfAssessmentSa100Context:
      type: object
      required: [taxYear, otherTaxableIncome, allSelfEmploymentsDisclosed, migrationConflict]
      properties:
        taxYear:
          type: string
        otherTaxableIncome:
          type: number
          nullable: true
        allSelfEmploymentsDisclosed:
          type: boolean
          nullable: true
        migrationConflict:
          type: boolean

    SelfAssessmentSa100ContextUpdate:
      type: object
      properties:
        otherTaxableIncome:
          type: number
          minimum: 0
          nullable: true
        allSelfEmploymentsDisclosed:
          type: boolean
          nullable: true

    SelfAssessmentSa103sContext:
      type: object
      required: [profileId, taxYear, selfEmploymentStartDate, businessDescription, accountingPeriodEndDate, accountingPeriodConfirmed, recordsCompleteConfirmed, derivedFiguresReviewed]
      properties:
        profileId:
          type: string
        taxYear:
          type: string
        selfEmploymentStartDate:
          type: string
          nullable: true
        businessDescription:
          type: string
          nullable: true
        accountingPeriodEndDate:
          type: string
          nullable: true
        accountingPeriodConfirmed:
          type: boolean
          nullable: true
        recordsCompleteConfirmed:
          type: boolean
          nullable: true
        derivedFiguresReviewed:
          type: boolean
          nullable: true

    SelfAssessmentSa103sContextUpdate:
      type: object
      properties:
        selfEmploymentStartDate:
          type: string
          nullable: true
        businessDescription:
          type: string
          nullable: true
        accountingPeriodEndDate:
          type: string
          nullable: true
        accountingPeriodConfirmed:
          type: boolean
          nullable: true
        recordsCompleteConfirmed:
          type: boolean
          nullable: true
        derivedFiguresReviewed:
          type: boolean
          nullable: true

    SelfAssessmentReadinessConcept:
      type: object
      required: [id, section, label, status, value, source, explanation]
      properties:
        id:
          type: string
        section:
          type: string
          enum: [SA100, SA103S, Return]
        label:
          type: string
        status:
          type: string
          enum: [complete, derived, missing, needs_confirmation]
        value:
          nullable: true
        source:
          type: string
        explanation:
          type: string

    SelfAssessmentReadinessGroups:
      type: object
      required: [complete, derived, missing, needsConfirmation]
      properties:
        complete:
          type: array
          items:
            $ref: '#/components/schemas/SelfAssessmentReadinessConcept'
        derived:
          type: array
          items:
            $ref: '#/components/schemas/SelfAssessmentReadinessConcept'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/SelfAssessmentReadinessConcept'
        needsConfirmation:
          type: array
          items:
            $ref: '#/components/schemas/SelfAssessmentReadinessConcept'

    SelfAssessmentReadiness:
      type: object
      required: [schemaVersion, taxYear, returnStructure, financialCoverage, groups]
      properties:
        schemaVersion:
          type: string
        taxYear:
          type: string
        returnStructure:
          type: object
          required: [model, activeBusinessProfileId, businessSectionCount, businessSections, note]
          properties:
            model:
              type: string
            activeBusinessProfileId:
              type: string
            businessSectionCount:
              type: number
            businessSections:
              type: array
              items:
                type: object
                required: [profileId, businessName, isActive, hasBusinessContext]
                properties:
                  profileId:
                    type: string
                  businessName:
                    type: string
                  isActive:
                    type: boolean
                  hasBusinessContext:
                    type: boolean
            note:
              type: string
        financialCoverage:
          type: object
          required: [periodStart, periodEnd, hasStarted, isYearToDate, turnover, totalExpenses, allowableExpenses, taxableBusinessProfit, recordCount]
          properties:
            periodStart:
              type: string
            periodEnd:
              type: string
            hasStarted:
              type: boolean
            isYearToDate:
              type: boolean
            turnover:
              type: number
            totalExpenses:
              type: number
            allowableExpenses:
              type: number
            taxableBusinessProfit:
              type: number
            recordCount:
              type: number
        groups:
          $ref: '#/components/schemas/SelfAssessmentReadinessGroups'

    SelfAssessmentReadinessResponse:
      type: object
      required: [identity, sa100Context, sa103sContext, readiness]
      properties:
        identity:
          $ref: '#/components/schemas/SelfAssessmentIdentity'
        sa100Context:
          $ref: '#/components/schemas/SelfAssessmentSa100Context'
        sa103sContext:
          anyOf:
            - $ref: '#/components/schemas/SelfAssessmentSa103sContext'
            - type: 'null'
        readiness:
          $ref: '#/components/schemas/SelfAssessmentReadiness'

    IncomeTaxEstimateResponse:
      type: object
      required: [period, taxYear, accountingBasis, profitLoss, categories, estimate]
      properties:
        period:
          $ref: '#/components/schemas/TaxPeriod'
        taxYear:
          type: string
        accountingBasis:
          type: string
          enum: [cash, accrual]
        profitLoss:
          $ref: '#/components/schemas/YtdProfitLoss'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/IncomeTaxCategory'
        estimate:
          $ref: '#/components/schemas/IncomeTaxEstimate'

    TaxPeriod:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
        end:
          type: string

    YtdProfitLoss:
      type: object
      required: [totalIncome, totalExpenses, profitLoss, taxableBusinessProfit, recordCount]
      properties:
        totalIncome:
          type: number
        totalExpenses:
          type: number
        profitLoss:
          type: number
        taxableBusinessProfit:
          type: number
        recordCount:
          type: number

    IncomeTaxCategory:
      type: object
      required: [category, recordType, amount, records]
      properties:
        category:
          type: string
        recordType:
          type: string
          enum: [income, expense]
        amount:
          type: number
        records:
          type: array
          items:
            $ref: '#/components/schemas/IncomeTaxRecord'

    IncomeTaxRecord:
      type: object
      required: [id, date, description, amount]
      properties:
        id:
          type: string
        date:
          type: string
        description:
          type: string
        amount:
          type: number

    IncomeTaxEstimate:
      type: object
      required: [status, taxYear, accountingBasis, businessProfitInput, otherTaxableIncome, totalIncome, personalAllowance, taxableIncome, estimatedIncomeTax, bands, assumptions, missingInputs]
      properties:
        status:
          type: string
          enum: [complete, incomplete]
        taxYear:
          type: string
        accountingBasis:
          type: string
          enum: [cash, accrual]
        businessProfitInput:
          type: number
        otherTaxableIncome:
          type: number
          nullable: true
        totalIncome:
          type: number
          nullable: true
        personalAllowance:
          type: number
          nullable: true
        taxableIncome:
          type: number
          nullable: true
        estimatedIncomeTax:
          type: number
          nullable: true
        bands:
          type: array
          items:
            $ref: '#/components/schemas/IncomeTaxBand'
        assumptions:
          type: array
          items:
            type: string
        missingInputs:
          type: array
          items:
            type: string

    IncomeTaxBand:
      type: object
      required: [label, rate, taxableAmount, tax]
      properties:
        label:
          type: string
        rate:
          type: number
        taxableAmount:
          type: number
        tax:
          type: number

    PLBreakdown:
      type: object
      required: [revenues, confirmedExpenses, pendingExpenses, profit]
      properties:
        revenues:
          type: number
        confirmedExpenses:
          type: number
        pendingExpenses:
          type: number
        profit:
          type: number

    TaxLine:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          type: number

    TaxCalculation:
      type: object
      required: [lines, balanceDue, reserveGap]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TaxLine'
        balanceDue:
          type: number
        reserveGap:
          type: number

    AccountBalance:
      type: object
      required: [name, balance]
      properties:
        name:
          type: string
        balance:
          type: number

    CashPosition:
      type: object
      required: [accounts, taxReserve, apDueWithin30Days, netAvailable]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
        taxReserve:
          type: number
        apDueWithin30Days:
          type: number
        netAvailable:
          type: number

    AREntry:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: number
        daysPastDue:
          type: number
        invoiceCount:
          type: number

    APEntry:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: number
        daysUntilDue:
          type: number

    KPI:
      type: object
      required: [id, label, value, trend, basis]
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
        trend:
          type: string
        basis:
          type: string
        rawValue:
          type: number
        detail:
          type: string

    SAReadiness:
      type: object
      required: [score, completedCount, totalCount]
      properties:
        score:
          type: number
        completedCount:
          type: number
        totalCount:
          type: number

    FinancialPosition:
      type: object
      required: [plBreakdown, taxCalculation, cashPosition, arEntries, apEntries, kpis, saReadiness, pendingInboxCount]
      properties:
        plBreakdown:
          $ref: '#/components/schemas/PLBreakdown'
        taxCalculation:
          $ref: '#/components/schemas/TaxCalculation'
        cashPosition:
          $ref: '#/components/schemas/CashPosition'
        arEntries:
          type: array
          items:
            $ref: '#/components/schemas/AREntry'
        apEntries:
          type: array
          items:
            $ref: '#/components/schemas/APEntry'
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KPI'
        saReadiness:
          $ref: '#/components/schemas/SAReadiness'
        pendingInboxCount:
          type: number

    ExtractedData:
      type: object
      properties:
        supplier:
          type: string
        date:
          type: string
        amount:
          type: number
        description:
          type: string
        taxTreatment:
          type: string
        confidence:
          type: number
        needsReview:
          type: boolean
        rawText:
          type: string

    EvidenceItem:
      type: object
      required: [id, profileId, filename, objectPath, mimeType, category, status, createdAt]
      properties:
        id:
          type: string
        profileId:
          type: string
        filename:
          type: string
        objectPath:
          type: string
        mimeType:
          type: string
        category:
          type: string
        status:
          type: string
        extractedData:
          $ref: '#/components/schemas/ExtractedData'
        confidence:
          type: [number, 'null']
        aiReasoning:
          type: [string, 'null']
        createdAt:
          type: string

    EvidenceInput:
      type: object
      required: [filename, objectPath, mimeType]
      properties:
        filename:
          type: string
        objectPath:
          type: string
        mimeType:
          type: string
        category:
          type: string

    EvidenceLink:
      type: object
      required: [id, evidenceId, linkedAt, filename, mimeType, documentLifecycle]
      properties:
        id:
          type: string
        evidenceId:
          type: string
        linkedAt:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        documentLifecycle:
          type: string
          enum: [active, replaced, tombstoned]

    Transaction:
      type: object
      required: [id, profileId, date, description, amount, recordType, category, taxTreatment, source, createdAt, updatedAt]
      properties:
        id:
          type: string
        profileId:
          type: string
        date:
          type: string
        description:
          type: string
        amount:
          type: number
        recordType:
          type: string
          enum: [income, expense, unknown]
        category:
          type: string
        note:
          type: [string, 'null']
        taxTreatment:
          type: string
        source:
          type: string
        evidenceId:
          type: [string, 'null']
        accountingClassification:
          type: [string, 'null']
          enum: [income, expense, transfer, owner_funds, drawings, loan, tax_payment, unknown, null]
        financialAccountId:
          type: [string, 'null']
        bankImportBatchId:
