name: Canonical PR Validation

on:
  pull_request:
    branches:
      - stabilisation/canonical-20260826

concurrency:
  group: canonical-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_copilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_copilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVIDENCE_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/finance_copilot_ci
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run safe canonical baseline tests
        run: pnpm test:baseline-safe

      - name: Run isolated evidence DB regression suite
        run: pnpm --filter @workspace/api-server run test:evidence-safety

      - name: Build workspace library type declarations
        run: pnpm run typecheck:libs

      - name: Run API-server typecheck
        run: pnpm --filter @workspace/api-server run typecheck
