name: Controller Branch Test

on:
  issue_comment:
    types: [created]

jobs:
  branch-test:
    if: |
      github.actor == 'jamiemokch' &&
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@controller-test')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout delivered implementation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: claude-build/issue-${{ github.event.issue.number }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused spreadsheet AI tests
        run: pnpm --filter @workspace/api-server run test:spreadsheet-ai

      - name: Run safe canonical regression baseline
        run: pnpm test:baseline-safe
