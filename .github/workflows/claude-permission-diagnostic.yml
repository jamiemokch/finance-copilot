name: Claude Permission Diagnostic

on:
  issue_comment:
    types: [created]

jobs:
  permission-diagnostic:
    if: |
      github.actor == 'jamiemokch' &&
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude-permission-diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    steps:
      - name: Checkout disposable diagnostic branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: claude-diagnostic/issue-${{ github.event.issue.number }}

      - name: Run Claude permission diagnostic
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: "stabilisation/canonical-20260826"
          show_full_output: true
          prompt: |
            CONTROL-PLANE PERMISSION DIAGNOSTIC ONLY. Do not modify any Finance Copilot application, test, package, config, workflow, database, runtime, or deployment file.
            The controller has already checked out the only disposable branch you may modify.
            Do not create, switch, merge, rebase, reset, or delete branches.

            Perform these exact actions in order and do not try alternatives if any action is denied:
            1. Create only `docs/claude-permission-diagnostic-21.md` containing: `Claude permission diagnostic marker for issue #21.`
            2. Run `pnpm test:baseline-safe`.
            3. Run `git diff`.
            4. Run `git status`.
            5. Run `git add docs/claude-permission-diagnostic-21.md`.
            6. Run `git commit -m "Add Claude permission diagnostic marker"`.
            7. Run `git push origin HEAD`.

            If any required tool or command is permission-denied, stop immediately and state the exact tool/command and denial in the final response. Do not substitute another command.
            If all succeed, state that write, baseline test, diff/status, add, commit and push all succeeded.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Write,Edit,Bash(git diff:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(pnpm:*)"
            --disallowedTools "NotebookEdit,WebSearch,WebFetch,Bash(curl:*),Bash(wget:*),Bash(psql:*),Bash(docker:*),Bash(replit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git merge:*),Bash(git rebase:*),Bash(git reset:*),Bash(git push --force:*),Bash(git push origin main:*),Bash(git push origin stabilisation/canonical-20260826:*)"
