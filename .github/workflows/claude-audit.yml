name: Claude Diagnostic Audit

on:
  issue_comment:
    types: [created]

jobs:
  claude-audit:
    if: |
      github.actor == 'jamiemokch' &&
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '@claude-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code diagnostic audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude-audit"
          claude_args: |
            --max-turns 20
            --allowedTools "Glob,Grep,LS,Read,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git rev-parse:*),mcp__github_comment__update_claude_comment"
            --disallowedTools "Edit,Write,NotebookEdit,WebSearch,WebFetch,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*),Bash(/home/runner/work/_actions/anthropics/claude-code-action/v1/scripts/git-push.sh:*)"
