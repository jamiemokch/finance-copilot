name: Claude Diagnostic Audit

on:
  issue_comment:
    types: [created]

jobs:
  claude-audit:
    if: |
      github.actor == 'jamiemokch' &&
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '@claude-audit')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code diagnostic audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-audit"
          claude_args: |
            --max-turns 12
